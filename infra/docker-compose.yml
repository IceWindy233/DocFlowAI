name: docflow-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DOCFLOW_POSTGRES_DB:-docflow}
      POSTGRES_USER: ${DOCFLOW_POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${DOCFLOW_POSTGRES_PASSWORD:-docflow_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - docflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCFLOW_POSTGRES_USER:-docflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - docflow_redis:/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - docflow_qdrant:/qdrant/storage

volumes:
  docflow_postgres:
  docflow_redis:
  docflow_qdrant:
