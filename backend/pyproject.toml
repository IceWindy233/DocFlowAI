[project]
name = "docflow-ai"
version = "0.1.0"
description = "公文多模态解析、知识入库与配置中心"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain-core>=1.2,<2",
  "langgraph>=1.0,<2",
  "openpyxl>=3.1",
  "orjson>=3.10",
  "pdfplumber>=0.11",
  "pillow>=10.4",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "qdrant-client>=1.12",
  "redis>=5.1",
  "rarfile>=4.2",
  "rich>=13.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
ml = [
  "colpali-engine>=0.3.5",
  "docling>=2.15",
  "rapidocr-onnxruntime>=1.4",
  "torch==2.5.1",
  "transformers>=4.46",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
docflow = "docflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
